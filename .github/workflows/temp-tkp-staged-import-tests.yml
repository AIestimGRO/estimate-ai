name: temp-tkp-staged-import-tests

on:
  push:
    branches:
      - work/tkp-staged-import-20260831
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
      - name: Package updated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estimate-ai-tkp-staged-import-updated-files
          path: |
            app/web/app.py
            app/web/rendering.py
            core/tkp_ingest.py
            core/tkp_folder_ingest.py
            core/storage/tkp.py
            tests/test_tkp_folder_ingest.py
            tests/test_storage_tkp.py
            docs/DOMAIN_RULES.md
            docs/ROADMAP.md
          if-no-files-found: error
